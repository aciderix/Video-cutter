name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, typecheck, test (TS + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps (for cargo test)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf ffmpeg

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build a tone+silence+tone fixture for peaks test
        run: |
          ffmpeg -y -f lavfi -i "sine=frequency=440:duration=1" \
                 -f lavfi -i "anullsrc=duration=1.5" \
                 -f lavfi -i "sine=frequency=880:duration=1" \
                 -filter_complex "[0][1][2]concat=n=3:v=0:a=1[a]" -map "[a]" \
                 -ac 1 -ar 16000 /tmp/test.wav

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib

      - name: Version drift check
        run: |
          PKG=$(node -p "require('./package.json').version")
          CORE=$(grep -oP '"version": "\K[^"]+' packages/core/package.json)
          DESK=$(grep -oP '"version": "\K[^"]+' apps/desktop/package.json)
          MOB=$(grep -oP '"version": "\K[^"]+' apps/mobile/package.json)
          CARGO=$(grep -oP '^version = "\K[^"]+' apps/desktop/src-tauri/Cargo.toml)
          TS=$(grep -oP "SNIPVOX_VERSION = '\K[^']+" packages/core/src/version.ts)
          echo "root=$PKG core=$CORE desktop=$DESK mobile=$MOB cargo=$CARGO ts=$TS"
          test "$PKG" = "$CORE" -a "$PKG" = "$DESK" -a "$PKG" = "$MOB" -a "$PKG" = "$CARGO" -a "$PKG" = "$TS"

  desktop-build:
    name: Desktop bundle (${{ matrix.target }})
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            bundles: deb,appimage
          - os: macos-latest
            target: macos
            bundles: dmg,app
          - os: windows-latest
            target: windows
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm --filter @snipvox/desktop build

      - name: Tauri build
        working-directory: apps/desktop
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: snipvox-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*

  mobile-build:
    name: Mobile (Android APK + web)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @snipvox/mobile build

      - name: Capacitor sync + Android APK
        working-directory: apps/mobile
        run: |
          pnpm exec cap add android || true
          pnpm exec cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: snipvox-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
