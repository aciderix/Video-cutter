name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, typecheck, test (TS + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps (for cargo test)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf ffmpeg

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build a tone+silence+tone fixture for peaks test
        run: |
          ffmpeg -y -f lavfi -i "sine=frequency=440:duration=1" \
                 -f lavfi -i "anullsrc=duration=1.5" \
                 -f lavfi -i "sine=frequency=880:duration=1" \
                 -filter_complex "[0][1][2]concat=n=3:v=0:a=1[a]" -map "[a]" \
                 -ac 1 -ar 16000 /tmp/test.wav

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib

      - name: Version drift check
        run: |
          PKG=$(node -p "require('./package.json').version")
          CORE=$(grep -oP '"version": "\K[^"]+' packages/core/package.json)
          DESK=$(grep -oP '"version": "\K[^"]+' apps/desktop/package.json)
          MOB=$(grep -oP '"version": "\K[^"]+' apps/mobile/package.json)
          CARGO=$(grep -oP '^version = "\K[^"]+' apps/desktop/src-tauri/Cargo.toml)
          TS=$(grep -oP "SNIPVOX_VERSION = '\K[^']+" packages/core/src/version.ts)
          echo "root=$PKG core=$CORE desktop=$DESK mobile=$MOB cargo=$CARGO ts=$TS"
          test "$PKG" = "$CORE" -a "$PKG" = "$DESK" -a "$PKG" = "$MOB" -a "$PKG" = "$CARGO" -a "$PKG" = "$TS"

  desktop-build:
    name: Desktop bundle (${{ matrix.target }})
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            bundles: deb,appimage
          - os: macos-latest
            target: macos
            bundles: dmg,app
          - os: windows-latest
            target: windows
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Regenerate platform icons from branding master
        working-directory: apps/desktop
        run: pnpm exec tauri icon ../../branding/snipvox-icon.png

      - name: Fetch FFmpeg + ffprobe sidecars
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            TAURI_FFMPEG_TARGET=aarch64-apple-darwin bash scripts/fetch-ffmpeg.sh
            TAURI_FFMPEG_TARGET=x86_64-apple-darwin  bash scripts/fetch-ffmpeg.sh
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            TAURI_FFMPEG_TARGET=x86_64-pc-windows-msvc bash scripts/fetch-ffmpeg.sh
          else
            TAURI_FFMPEG_TARGET=x86_64-unknown-linux-gnu bash scripts/fetch-ffmpeg.sh
          fi

      - name: Build web bundle
        run: pnpm --filter @snipvox/desktop build

      - name: Tauri build
        working-directory: apps/desktop
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: snipvox-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*

  mobile-build:
    name: Mobile (Android APK + web)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @snipvox/mobile build

      - name: Capacitor sync + Android APK
        working-directory: apps/mobile
        run: |
          pnpm exec cap add android || true
          pnpm exec cap sync android

      - name: Apply SnipVox launcher icons to Capacitor android
        run: |
          set -euo pipefail
          SRC=apps/desktop/src-tauri/icons/android
          DST=apps/mobile/android/app/src/main/res
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            cp "$SRC/mipmap-$d/ic_launcher.png"       "$DST/mipmap-$d/ic_launcher.png"
            cp "$SRC/mipmap-$d/ic_launcher_round.png" "$DST/mipmap-$d/ic_launcher_round.png"
          done
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open('branding/snipvox-icon.png').convert('RGBA')
          content = src.crop(src.getbbox())
          densities = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          SAFE = 0.66
          for d, sz in densities.items():
              safe = int(sz * SAFE)
              scale = min(safe / content.width, safe / content.height)
              cw, ch = int(content.width * scale), int(content.height * scale)
              resized = content.resize((cw, ch), Image.LANCZOS)
              canvas = Image.new('RGBA', (sz, sz), (0, 0, 0, 0))
              canvas.paste(resized, ((sz - cw) // 2, (sz - ch) // 2), resized)
              out = Path(f'apps/mobile/android/app/src/main/res/mipmap-{d}/ic_launcher_foreground.png')
              canvas.save(out, 'PNG')
              print('wrote', out)
          PY
          mkdir -p "$DST/values"
          cat > "$DST/values/ic_launcher_background.xml" <<'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <color name="ic_launcher_background">#0F1117</color>
          </resources>
          XML

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: snipvox-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
