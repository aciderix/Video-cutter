name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.8.0). Created if missing.'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRE="false"
          fi
          VER="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [[ "$VER" != "$PKG" ]]; then
            echo "Tag $TAG does not match package version $PKG"; exit 1
          fi
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "version=$VER"    >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.target }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            bundles: deb,appimage
          - os: macos-latest
            target: macos-universal
            bundles: dmg,app
            args: --target universal-apple-darwin
          - os: windows-latest
            target: windows-x64
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Regenerate platform icons from branding master
        working-directory: apps/desktop
        run: pnpm exec tauri icon ../../branding/snipvox-icon.png

      - name: Fetch FFmpeg + ffprobe sidecars
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            TAURI_FFMPEG_TARGET=aarch64-apple-darwin bash scripts/fetch-ffmpeg.sh
            TAURI_FFMPEG_TARGET=x86_64-apple-darwin  bash scripts/fetch-ffmpeg.sh
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            TAURI_FFMPEG_TARGET=x86_64-pc-windows-msvc bash scripts/fetch-ffmpeg.sh
          else
            TAURI_FFMPEG_TARGET=x86_64-unknown-linux-gnu bash scripts/fetch-ffmpeg.sh
          fi

      - name: Build web bundle
        run: pnpm --filter @snipvox/desktop build

      - name: Tauri build
        working-directory: apps/desktop
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staging
          BUNDLE=apps/desktop/src-tauri/target
          # macOS uses the universal-apple-darwin sub-path; others use release/bundle.
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            SRC="$BUNDLE/universal-apple-darwin/release/bundle"
          else
            SRC="$BUNDLE/release/bundle"
          fi
          find "$SRC" \( -name '*.deb' -o -name '*.AppImage' \
                        -o -name '*.dmg' -o -name '*.msi' \
                        -o -name '*.exe' \) -type f -print0 \
            | xargs -0 -I{} cp -v "{}" staging/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: staging/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - run: pnpm install --frozen-lockfile

      - name: Build mobile web bundle
        run: pnpm --filter @snipvox/mobile build

      - name: Capacitor sync + Android APK
        working-directory: apps/mobile
        run: |
          pnpm exec cap add android || true
          pnpm exec cap sync android

      - name: Apply SnipVox launcher icons to Capacitor android
        run: |
          set -euo pipefail
          SRC=apps/desktop/src-tauri/icons/android
          DST=apps/mobile/android/app/src/main/res
          # Legacy square + round launcher PNGs (Android <8) — Tauri's
          # masked variants in src-tauri/icons/android are already
          # cropped to the rounded-square / circle shapes.
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            cp "$SRC/mipmap-$d/ic_launcher.png"       "$DST/mipmap-$d/ic_launcher.png"
            cp "$SRC/mipmap-$d/ic_launcher_round.png" "$DST/mipmap-$d/ic_launcher_round.png"
          done
          # Adaptive-icon foreground (Android 8+): re-render at 66% of the
          # canvas on a transparent background so the launcher's safe-zone
          # mask doesn't bite into the gradient and we don't ship a black
          # square behind the logo. Same scale used by scripts/branding-sync.sh.
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open('branding/snipvox-icon.png').convert('RGBA')
          content = src.crop(src.getbbox())
          densities = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          SAFE = 0.66
          for d, sz in densities.items():
              safe = int(sz * SAFE)
              scale = min(safe / content.width, safe / content.height)
              cw, ch = int(content.width * scale), int(content.height * scale)
              resized = content.resize((cw, ch), Image.LANCZOS)
              canvas = Image.new('RGBA', (sz, sz), (0, 0, 0, 0))
              canvas.paste(resized, ((sz - cw) // 2, (sz - ch) // 2), resized)
              out = Path(f'apps/mobile/android/app/src/main/res/mipmap-{d}/ic_launcher_foreground.png')
              canvas.save(out, 'PNG')
              print('wrote', out)
          PY
          # Background colour referenced by mipmap-anydpi-v26/ic_launcher.xml.
          mkdir -p "$DST/values"
          cat > "$DST/values/ic_launcher_background.xml" <<'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <color name="ic_launcher_background">#0F1117</color>
          </resources>
          XML

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          mkdir -p staging
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             staging/snipvox-${{ needs.resolve.outputs.version }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: staging/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name '*.deb' -o -name '*.AppImage' \
            -o -name '*.dmg' -o -name '*.msi' \
            -o -name '*.exe' -o -name '*.apk' \) \
            -exec cp -v {} release-assets/ \;
          ls -la release-assets

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: SnipVox ${{ needs.resolve.outputs.tag }}
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
